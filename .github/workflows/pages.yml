name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # Daily at 08:00 KST (UTC+9).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test installer
        run: ./test-install.sh

      - name: Test install count
        run: python3 test-install-count.py

      - name: Prepare static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp index.html install.sh deferred-macos-app-swap.sh styles.css robots.txt sitemap.xml google8ef6ae6d5003d1da.html _site/
          cp -R assets _site/
          gh api 'repos/flowmux-ai/flowmux/releases?per_page=100' --paginate --jq '.[] | .assets[] | @json' > "$RUNNER_TEMP/flowmux-assets.jsonl"
          python3 update-install-count.py "$RUNNER_TEMP/flowmux-assets.jsonl" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
